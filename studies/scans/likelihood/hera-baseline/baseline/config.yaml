# Profile-likelihood scans for the 14 free HERA PDF parameters without EoE.
scan_type: likelihood-scan
xfitter_tree: xfitter-master
template: hera-baseline
reference_fit: ../../../../../runs/fits/hera-baseline/nominal-bartlett2-pumplin
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5

scan_defaults: {n_sigma: 3, npoints: 31}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics: []

scan_params_1d:
  - {name: ADbar}
  - {name: Agp}
  - {name: BDbar}
  - {name: Bdv}
  - {name: Bg}
  - {name: Bgp}
  - {name: Buv}
  - {name: CDbar}
  - {name: CUbar}
  - {name: Cdv}
  - {name: Cg}
  - {name: Cuv}
  - {name: DUbar}
  - {name: Euv}

scan_type: likelihood-scan
template: hera-baseline

reference_fit: ../../../../../fits/hera-baseline/eoe

scan_defaults:
  n_sigma: 3
  npoints: 31

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: proc_tb21,    type: E, epsilon: 0.5}
  - {name: sysHZComb1053, type: E, epsilon: 0.5}
  - {name: sysHZComb1055, type: E, epsilon: 0.5}
  - {name: sysHZComb1056, type: N, epsilon: 0.5}

# 1D scan over E-type systematics: fixed via MINUIT SET PAR / FIX commands.
scan_systematics_1d:
  - {name: proc_tb21}
  - {name: sysHZComb1053}
  - {name: sysHZComb1055}

# 1D scan: 14 PDF parameters.
scan_params_1d:
  - {name: ADbar}
  - {name: Agp}
  - {name: BDbar}
  - {name: Bdv}
  - {name: Bg}
  - {name: Bgp}
  - {name: Buv}
  - {name: CDbar}
  - {name: CUbar}
  - {name: Cdv}
  - {name: Cg}
  - {name: Cuv}
  - {name: DUbar}
  - {name: Euv}

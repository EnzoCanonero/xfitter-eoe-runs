scan_type: systematic-ranking
template: giuli-param
epsilon: 0.6

# SINGLE result fit (not a scan). Forward-selected Giuli EoE configuration obtained so far
# {1053,1062,1114,1144,1111} (dchi2>1 stopping point), all eps 0.6, Bartlett-corrected, with
# Pumplin PDF uncertainties (SET ERRDEF 0.5, ITERATE 10). EoE nuisances warm-started at their
# current joint minimum (from giuli-6th-.../runs/nominal) to simplify convergence.
# systematics: [] => the generator produces only the base-only fit (runs/nominal).
doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10

base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.1353}
  - {name: sysHZComb1062, type: E, init: -5.3979}
  - {name: sysHZComb1114, type: E, init: 4.3639}
  - {name: sysHZComb1144, type: E, init: 4.4305}
  - {name: sysHZComb1111, type: E, init: -2.5280}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# No candidates: this is a single fixed-configuration fit.
systematics: []

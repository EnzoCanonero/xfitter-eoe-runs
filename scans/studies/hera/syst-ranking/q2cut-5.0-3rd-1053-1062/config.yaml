scan_type: systematic-ranking
template: q2cut-5.0
epsilon: 0.6

# Third-order forward-selection scan (Q2cut = 5.0, baseline parametrization).
# sysHZComb1053 + sysHZComb1062 are held ON in every fit (eps 0.6), warm-started at
# their JOINT converged values from the 2nd-order {1053,1062} fit
# (q2cut-5.0-2nd-1053/runs/sysHZComb1062). Every candidate is ranked by its marginal
# impact on top of {1053, 1062}. The nominal fit is the {1053, 1062}-only fit. Both base
# sources are auto-excluded from the candidate list.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.7162}
  - {name: sysHZComb1062, type: E, init: -7.0246}

# HERA datafiles (all 7 files)
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (the two base sources removed automatically).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

scan_type: likelihood-scan
template: hera-baseline

# Reference fit: EoE baseline with sysHZComb1053 as a free MINUIT parameter.
# Run fits/hera/hera-baseline/eoe-sysHZComb1053 first to populate output/minuit.out.txt.
reference_fit: ../../../../../fits/hera/hera-baseline/eoe-sysHZComb1053-eps0.5

scan_defaults:
  n_sigma: 3
  npoints: 31

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# sysHZComb1053 treated as a free MINUIT parameter (EoE, Bartlett correction active).
systematics:
  - {name: sysHZComb1053, type: E, epsilon: 0.5}

# 1D scan over the E-type systematic: fixed via MINUIT SET PAR / FIX commands.
scan_systematics_1d:
  - {name: sysHZComb1053}

# 1D scan: 14 PDF parameters. sysHZComb1053 is free during profiling but not scanned here.
scan_params_1d:
  - {name: ADbar}
  - {name: Agp}
  - {name: BDbar}
  - {name: Bdv}
  - {name: Bg}
  - {name: Bgp}
  - {name: Buv}
  - {name: CDbar}
  - {name: CUbar}
  - {name: Cdv}
  - {name: Cg}
  - {name: Cuv}
  - {name: DUbar}
  - {name: Euv}

# parameter_overrides:
#   DUbar: {step: 2.5}

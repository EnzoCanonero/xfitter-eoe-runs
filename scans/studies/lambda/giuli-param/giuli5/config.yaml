# lambda-scan: EoE strength (epsilon*lambda) for the greedy-selected Giuli sources.
#
# Counterpart of lambda/hera-baseline/hera7 for the Bonvini-Giuli parameterisation,
# so that the two can be compared on the same footing (Sec. interplay). Note the
# selection differs from the HERA-baseline one (1062 rather than 1064, and no
# proc_tb21) -- that contrast is itself a result.
#
# lambda=0 is the Gaussian fit, lambda=1 the nominal eps=0.6 configuration.
# doErrors: Pumplin makes sigma(lambda) in the pull plot a real confidence
# interval; init warm-starts each source at its converged shift from the last
# greedy round.
# NB these are the CURRENT greedy sources; update if the redone chain changes them.
scan_type: lambda-scan
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.6
lambda: {min: 0.0, max: 1.2, step: 0.1}

doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat
systematics:
  - {name: sysHZComb1053, type: E, init: -16.1335}
  - {name: sysHZComb1062, type: E, init: -5.3984}
  - {name: sysHZComb1114, type: E, init: 4.3648}
  - {name: sysHZComb1144, type: E, init: 4.4317}
  - {name: sysHZComb1111, type: E, init: -2.5278}

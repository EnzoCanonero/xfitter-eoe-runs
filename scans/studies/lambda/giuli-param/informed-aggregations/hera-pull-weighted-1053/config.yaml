# Giuli-parametrization counterpart of the HERA pull-weighted study.
# Only sysHZComb1053 is scanned: epsilon_1053 = 0.6 lambda.
scan_type: lambda-scan
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param

lambda: {min: 0.0, max: 1.0, step: 0.1}
n_iterations: 8
enable_bartlett: true

doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  # The only scanned source, warm-started from the final Giuli greedy fit.
  - {name: sysHZComb1053, type: E, epsilon: 0.6, init: -15.8343,
     scale_with_lambda: true}

  # Procedural sources: fixed at epsilon = 0.6.
  - {name: proc_tb21, type: N, epsilon: 0.6,
     scale_with_lambda: false}
  - {name: proc_nrl, type: N, epsilon: 0.6, scale_with_lambda: false}
  - {name: proc_tb, range: "22-24", type: N, epsilon: 0.6,
     scale_with_lambda: false}
  - {name: proc_gp, type: N, epsilon: 0.6, scale_with_lambda: false}
  - {name: proc_had, type: N, epsilon: 0.6, scale_with_lambda: false}

  # Other sources identified by the HERA combination pull study:

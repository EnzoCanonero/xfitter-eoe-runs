# lambda-scan: EoE strength (epsilon*lambda) for the greedy-selected HERA sources.
#
# lambda scales every source's epsilon, so lambda=0 is the Gaussian fit and
# lambda=1 the nominal eps=0.6 configuration. The parameter-pull plot produced
# from this scan (6_parameter_pulls.pdf) reports, for each PDF parameter, both
# the shift (mu(lambda)-mu(0))/sigma(0) and the change of its confidence
# interval sigma(lambda)/sigma(0), i.e. both are normalised to the Gaussian fit.
# The additional 7_parameter_comparison.pdf uses only the lambda=0 and lambda=1
# results to give a paper-style Gaussian-versus-EoE comparison, without lambda
# notation, and includes the Bartlett confidence-interval factor.
#
# doErrors: Pumplin is what makes the sigma(lambda) of that plot a real
# confidence interval rather than a MIGRAD parabolic error; it matches the
# lambda/hera-baseline/baseline study whose format the figure follows.
#
# init: warm starts each source at its converged shift from the last greedy
# round, so that the large-pull points (lambda ~ 1) start near their minimum.
# NB the sources below are the CURRENT greedy selection; if the redone chain on
# the Bartlett-corrected scale selects a different set, update this list.
scan_type: lambda-scan
xfitter_tree: xfitter-bartlett-fixes
template: hera-baseline
epsilon: 0.6
lambda: {min: 0.0, max: 1.2, step: 0.1}

doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb1053, type: E, init: -16.4095}
  - {name: proc_tb21,     type: E, init: -6.3118}
  - {name: sysHZComb1064, type: E, init: 9.9370}
  - {name: sysHZComb1114, type: E, init: 4.2443}
  - {name: sysHZComb1144, type: E, init: 4.0798}
  - {name: sysHZComb1111, type: E, init: -2.5331}
  - {name: sysHZComb1113, type: E, init: 3.8119}

# Lambda scan for the 60-source conservative informed aggregation.
scan_type: lambda-scan
xfitter_tree: xfitter-bartlett-fixes
template: hera-baseline

lambda: {min: 0.0, max: 1.2, step: 0.1}
n_iterations: 8
enable_bartlett: true

doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  # External sources are declared first so they remain MINUIT parameters 23 and 24.
  - {name: sysHZComb1053, type: E, epsilon: 0.5, init: -16.4095}
  - {name: proc_tb21, type: E, epsilon: 0.7, init: -6.3118}

  # Remaining procedural sources: epsilon = 0.7.

scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: hera-baseline
epsilon: 0.7
q2_cut: 3.5
n_iterations: 2
enable_bartlett: true

# Conditional eighth round at epsilon=0.7, assuming the complete epsilon=0.6
# prefix {sysHZComb1053, proc_tb21, sysHZComb1064, sysHZComb1114,
# sysHZComb1144, sysHZComb1111, sysHZComb1113}. Joint epsilon=0.6 minima are
# warm starts only; all parameters are minimised again at epsilon=0.7.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.4095}
  - {name: proc_tb21,     type: E, init: -6.3118}
  - {name: sysHZComb1064, type: E, init: 9.9370}
  - {name: sysHZComb1114, type: E, init: 4.2443}
  - {name: sysHZComb1144, type: E, init: 4.0798}
  - {name: sysHZComb1111, type: E, init: -2.5331}
  - {name: sysHZComb1113, type: E, init: 3.8119}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

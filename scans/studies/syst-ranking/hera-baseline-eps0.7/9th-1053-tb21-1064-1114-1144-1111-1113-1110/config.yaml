  - {name: sysHZComb1114, type: E, init:   4.672597}
  - {name: sysHZComb1144, type: E, init:   4.362132}
  - {name: sysHZComb1111, type: E, init:  -2.679544}
  - {name: sysHZComb1113, type: E, init:   4.156045}
  - {name: sysHZComb1110, type: E, init:  -2.070967}


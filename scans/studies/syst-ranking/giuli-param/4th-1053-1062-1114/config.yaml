scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.6

# Fourth-order forward-selection scan with the Giuli parametrization (Q2cut = 3.5).
# sysHZComb1053 + sysHZComb1062 + sysHZComb1114 are held ON in every fit (eps 0.6),
# warm-started at their JOINT converged values from the 3rd-order {1053,1062,1114} fit
# (giuli-3rd-1053-1062/runs/sysHZComb1114). Every candidate is ranked by its marginal
# impact on top of {1053, 1062, 1114}. The nominal fit is the {1053,1062,1114}-only fit.
# All three base sources are auto-excluded from the candidate list.
# Note: Giuli has 23 PDF parameters, so 1053=#24, 1062=#25, 1114=#26 (computed automatically).
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.0702}
  - {name: sysHZComb1062, type: E, init: -5.8169}
  - {name: sysHZComb1114, type: E, init: 4.1752}

# HERA datafiles (all 7 files)
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (the three base sources removed automatically).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.6

# Fifth-order forward-selection scan with the Giuli parametrization (Q2cut = 3.5).
# The 4th-round next source 1144 cleared the floor (dchi2 = 2.15), so this round is
# warranted under the dchi2>2 rule. Base held ON in every fit (eps 0.6), warm-started at
# the JOINT converged values from the 4th-order {1053,1062,1114,1144} fit
# (giuli-4th-.../runs/sysHZComb1144). Note: Giuli has 23 PDF params, so 1053=#24 ... 1144=#27.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.0270}
  - {name: sysHZComb1062, type: E, init: -5.3746}
  - {name: sysHZComb1114, type: E, init: 4.5484}
  - {name: sysHZComb1144, type: E, init: 4.6361}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

scan_type: systematic-ranking
template: giuli-param
epsilon: 0.6

# Sixth-order forward-selection scan with the Giuli parametrization (Q2cut = 3.5).
# Threshold lowered to dchi2 > 1 (next source 1111 had dchi2 = 1.30). Base held ON in every
# fit (eps 0.6), warm-started at the JOINT converged values from the 5th-order
# {1053,1062,1114,1144,1111} fit (giuli-5th-.../runs/sysHZComb1111).
# Note: Giuli has 23 PDF params, so 1053=#24 ... 1111=#28.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.1335}
  - {name: sysHZComb1062, type: E, init: -5.3984}
  - {name: sysHZComb1114, type: E, init: 4.3648}
  - {name: sysHZComb1144, type: E, init: 4.4317}
  - {name: sysHZComb1111, type: E, init: -2.5278}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

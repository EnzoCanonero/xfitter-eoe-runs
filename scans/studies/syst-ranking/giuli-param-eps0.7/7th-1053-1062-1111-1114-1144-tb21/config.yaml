scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.7
enable_bartlett: true
q2_cut: 3.5
n_iterations: 2

# Conditional check of the epsilon=0.6 ordering.  The assumed prefix is fitted
# at epsilon=0.7 in every job.  The values below are epsilon=0.6 warm starts only;
# all nuisance parameters remain free and are refitted.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -15.8343}
  - {name: sysHZComb1062, type: E, init: -5.3118}
  - {name: sysHZComb1111, type: E, init: -2.5348}
  - {name: sysHZComb1114, type: E, init: 4.3807}
  - {name: sysHZComb1144, type: E, init: 4.3125}
  - {name: proc_tb21, type: E, init: -2.3134}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

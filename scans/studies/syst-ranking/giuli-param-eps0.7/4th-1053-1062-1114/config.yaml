scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.7
enable_bartlett: true
q2_cut: 3.5
n_iterations: 2

# Corrected epsilon=0.7 branch after sysHZComb1114 narrowly overtook
# sysHZComb1111 in the preceding conditional scan.  The starting values are
# taken from that fitted candidate point; all nuisance parameters remain free.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.1984}
  - {name: sysHZComb1062, type: E, init: -6.1141}
  - {name: sysHZComb1114, type: E, init: 4.3460}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

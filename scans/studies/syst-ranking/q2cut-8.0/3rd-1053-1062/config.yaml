scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: q2cut-8.0
epsilon: 0.6

# Third-order forward-selection scan (Q2cut = 8.0, baseline parametrization).
# Threshold dchi2 > 1 (2nd-round next source 1062 had dchi2 = 5.23). sysHZComb1053 + sysHZComb1062
# held ON in every fit (eps 0.6), warm-started at their JOINT converged values from the 2nd-order
# {1053,1062} fit (q2cut-8.0-2nd-1053/runs/sysHZComb1062). Both base sources auto-excluded.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.8287}
  - {name: sysHZComb1062, type: E, init: -7.5207}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

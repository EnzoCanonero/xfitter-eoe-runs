scan_type: systematic-ranking
template: q2cut-8.0
epsilon: 0.6

# Second-order forward-selection scan (Q2cut = 8.0, baseline parametrization).
# Starts the forward-selection chain for the 8.0 cut: sysHZComb1053 (the 1st-order top,
# dchi2 = 23.6) is held ON in every fit (eps 0.6), warm-started at its 1st-order single-source
# minimum (shift = -17.7806). Every candidate is ranked by its marginal impact on top of 1053.
# The nominal fit is the 1053-only fit. 1053 is auto-excluded from the candidate list.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.7806}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

scan_type: systematic-ranking
template: q2cut-8.0
epsilon: 0.6

# Fourth-order forward-selection scan (Q2cut = 8.0, baseline parametrization), threshold dchi2 > 1
# (next source 1111 had dchi2 = 1.24). Base held ON in every fit (eps 0.6), warm-started at the
# JOINT converged values from the 3rd-order {1053,1062,1111} fit
# (q2cut-8.0-3rd-1053-1062/runs/sysHZComb1111).
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.9585}
  - {name: sysHZComb1062, type: E, init: -7.4970}
  - {name: sysHZComb1111, type: E, init: -2.5024}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

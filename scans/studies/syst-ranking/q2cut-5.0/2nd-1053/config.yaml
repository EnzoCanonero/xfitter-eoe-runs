scan_type: systematic-ranking
template: q2cut-5.0
epsilon: 0.6

# Second-order forward-selection scan at Q2cut = 5.0 (baseline parametrization).
# sysHZComb1053 is held ON in every fit (eps 0.6), warm-started at its single-source
# minimum from the Q2cut=5.0 EoE scan (shift = -17.6165). Every candidate is ranked by
# its marginal impact on top of an already-active 1053. The nominal fit is the
# 1053-only fit. 1053 is auto-excluded from the candidate list.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.6165}

# HERA datafiles (all 7 files)
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (sysHZComb1053 removed automatically as a base source).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

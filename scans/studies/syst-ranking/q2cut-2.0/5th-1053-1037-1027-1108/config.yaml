scan_type: systematic-ranking
template: q2cut-2.0
epsilon: 0.6

# Fifth-order forward-selection scan (Q2cut = 2.0, baseline parametrization).
# NOTE: this round is run by explicit request, overriding the dchi2>2 stop rule
# (the 4th-round top candidate 1108 had marginal dchi2 = 1.59, below the threshold).
# sysHZComb1053 + sysHZComb1037 + sysHZComb1027 + sysHZComb1108 are held ON in every fit
# (eps 0.6), warm-started at their JOINT converged values from the 4th-order
# {1053,1037,1027,1108} fit (q2cut-2.0-4th-1053-1037-1027/runs/sysHZComb1108). Every
# candidate is ranked by its marginal impact on top of those four. The nominal fit is the
# {1053,1037,1027,1108}-only fit. All four base sources are auto-excluded from the
# candidate list.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.4896}
  - {name: sysHZComb1037, type: E, init: 10.7323}
  - {name: sysHZComb1027, type: E, init: -9.4037}
  - {name: sysHZComb1108, type: E, init: 2.9483}

# HERA datafiles (all 7 files)
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (the four base sources removed automatically).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

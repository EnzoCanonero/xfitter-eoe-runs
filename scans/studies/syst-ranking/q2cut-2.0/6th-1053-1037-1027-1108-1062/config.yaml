scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: q2cut-2.0
epsilon: 0.6

# Sixth-order forward-selection scan (Q2cut = 2.0, baseline parametrization).
# Run by explicit request, beyond the dchi2>2 stop rule (next source 1062 had dchi2 = 1.10).
# Base held ON in every fit (eps 0.6), warm-started at the JOINT converged values from the
# 5th-order {1053,1037,1027,1108,1062} fit (q2cut-2.0-5th-.../runs/sysHZComb1062).
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.5686}
  - {name: sysHZComb1037, type: E, init: 10.5285}
  - {name: sysHZComb1027, type: E, init: -8.8546}
  - {name: sysHZComb1108, type: E, init: 3.0006}
  - {name: sysHZComb1062, type: E, init: -4.8563}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}

name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install test dependencies
        run: python -m pip install jinja2 numpy pandas pyyaml
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

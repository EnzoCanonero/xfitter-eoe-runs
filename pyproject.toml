[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xfitter-eoe-runs"
version = "0.1.0"
description = "Tools for xFitter errors-on-errors studies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Jinja2",
    "matplotlib",
    "numpy",
    "pandas",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

Minimizer: MINUIT
MINUIT:
  Commands: |
    call fcn 1
    set str 2
    migrad 100000
    call fcn 3


# Starting values: arXiv:1902.11125 Table 5, NNLO global-minimum column
# (value, step=published uncertainty). Gluon Bg<0 selects the global minimum.
  doErrors: |
    Pumplin
    SET ERRDEF 0.5
    ITERATE 10

Parameters:
  Ag   :  DEPENDENT
  Auv  :  DEPENDENT
  Adv  :  DEPENDENT
  ZERO : 0
  fs   : [ 0.4, 0.0 ]
  Adbar: [ 0.13,  0.02   ]
  Bdbar: [ -0.34, 0.02   ]
  Bdv  : [ 0.98,  0.10   ]
  Bg   : [ -0.55, 0.03   ]
  Buv  : [ 0.83,  0.06   ]
  Cdbar: [ 24.0,  2.0    ]
  Cdv  : [ 4.7,   0.5    ]
  Cg   : [ 4.5,   0.5    ]
  Cubar: [ 11.0,  1.0    ]
  Cuv  : [ 4.6,   0.2    ]
  Ddbar: [ 40.0,  12.0   ]
  Dubar: [ 20.0,  4.0    ]
  Euv  : [ 1.9,   1.0    ]
  Fdbar: [ 0.072, 0.004  ]
  Fg   : [ 0.230, 0.003  ]
  Fuv  : [ 0.37,  0.05   ]
  Gg   : [ 0.0131, 0.0004 ]
  Guv  : [ 0.058, 0.012  ]

Parameterisations:
  par_uv:
    class: Expression
    expression: "Auv*(x^Buv*(1-x)^Cuv)*(1+Euv*x^2+Fuv*ln(x)+Guv*ln(x)^2)"
  par_dv:
    class: Expression
    expression: "Adv*(x^Bdv*(1-x)^Cdv)"
  par_ubar:
    class: Expression
    expression: "Adbar*(x^Bdbar*(1-x)^Cubar)*(1+Dubar*x+Fdbar*ln(x))"
  par_dbar:
    class: Expression
    expression: "Adbar*(x^Bdbar*(1-x)^Cdbar)*(1+Ddbar*x+Fdbar*ln(x))"
  par_s:
    class: Expression
    expression: "Adbar*fs/(1-fs)*(x^Bdbar*(1-x)^Cdbar)*(1+Ddbar*x+Fdbar*ln(x))"
  par_g:
    class: Expression
    expression: "Ag*(x^Bg*(1-x)^Cg)*(1+Fg*ln(x)+Gg*ln(x)^2)"

DefaultDecomposition: proton
Decompositions:
  proton:
    class: UvDvUbarDbarS
    xuv: par_uv
    xdv: par_dv
    xubar: par_ubar
    xdbar: par_dbar
    xs: par_s
    xg: par_g

DefaultEvolution: proton-QCDNUM
Evolutions:
  proton-QCDNUM:
    ? !include evolutions/QCDNUM.yaml
    decomposition: proton

Q0 : 1.378404875209  # sqrt(1.9) GeV

? !include constants.yaml

alphas : 0.118

byReaction:
  RT_DISNC:
    ? !include reactions/RT_DISNC.yaml

hf_scheme_DISNC:
  defaultValue: 'RT_DISNC'

hf_scheme_DISCC:
  defaultValue: 'BaseDISCC'

WriteLHAPDF6:
  name: "proton"
  description: "..."
  authors: "..."
  reference: "..."
  preferInternalGrid:

OutputDirectory: "/nfs/scratch2/ecanoner/xfitter-eoe-runs/fits/hera-giuli-param/gaussian-bartlett2-pumplin/output"

MaxErrAllowed: 4

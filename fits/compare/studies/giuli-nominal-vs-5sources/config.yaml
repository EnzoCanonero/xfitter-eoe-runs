# Effect of errors-on-errors (giuli, Pumplin bands): standard fit with no EoE
# (gaussian) vs the 5-source all-External EoE fit. Ratio reference (fit 0) is the
# nominal fit, so the EoE curve shows the central shift and the uncertainty
# inflation that switching EoE on produces.
type: pdf-comparison
Q2: 4.0
error_type: symmetric
observables: [uv, dv, gluon, sea]
ratio_reference: 0
fits:
  - {label: "BG baseline", path: ../../../hera-giuli-param/gaussian-bartlett2-pumplin}
  - {label: "BG + EoE",   path: ../../../hera-giuli-param/giuli-5-sources-bartlett2-pumplin}

# CLOSURE CHECK: does our nominal HERA fit (Pumplin Delta-chi2=1 bands, 2026-07-13
# rerun) reproduce the OFFICIAL HERAPDF2.0 NNLO central values and experimental
# uncertainties from the LHAPDF library? Reference (fit 0) = official set, so the
# ratio panel reads our-fit / HERAPDF2.0.
type: pdf-comparison
Q2: 4.0
error_type: symmetric
observables: [uv, dv, gluon, sea]
ratio_reference: 0
fits:
  - {label: "HERAPDF2.0 NNLO (LHAPDF official)", lhapdf_set: "HERAPDF20_NNLO_EIG"}
  - {label: "nominal (our fit, Pumplin)",        path: ../../../hera-baseline/nominal-bartlett2-pumplin}

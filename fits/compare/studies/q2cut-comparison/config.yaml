# PDF comparison study: effect of the Q^2 cut on the fitted PDFs.
# Run from this directory:  ../../bin/plot   (or:  ln -s ../../bin/plot . && ./plot)
type: pdf-comparison

Q2: 10.0                       # observables evaluated at Q = sqrt(Q2) [GeV]
x_min: 1.0e-4
x_max: 0.9
observables: [uv, dv, gluon, sea]
error_type: asymmetric         # only used for sets that carry error members
ratio_reference: 0             # denominator for the ratio panel (index or label)

fits:
  - label: "Q2 > 2.0"
    path: ../../../Q2cut/q2cut-2.0
  - label: "Q2 > 5.0"
    path: ../../../Q2cut/q2cut-5.0
  - label: "Q2 > 8.0"
    path: ../../../Q2cut/q2cut-8.0

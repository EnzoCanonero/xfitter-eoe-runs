# EoE convergence (giuli, bartlett2 + Pumplin bands):
# does 1E4N with the 4 nuisance sources profiled over 8 Newton iteration(s)
# converge to the all-External 5-source fit? Ratio reference (fit 0) is the
# all-E target, so the second curve -> 1 as the profiling converges.
type: pdf-comparison
Q2: 4.0
error_type: symmetric
observables: [uv, dv, gluon, sea]
ratio_reference: 0
fits:
  - {label: "5-sources (all E) [target]", path: ../../../hera-giuli-param/giuli-5-sources-bartlett2-pumplin}
  - {label: "1E4N iter8 (4 N)",          path: ../../../hera-giuli-param/giuli-1E4N-niter8-bartlett2-pumplin}

# Candidate Figure 4: resummed Gaussian baseline versus five-source EoE.
# Inputs are explicit, read-only links to the requested 20260818 archives.
# Match Figure 3: native Pumplin grids, symmetric bands, Q2=4, same x range.
type: pdf-comparison
Q2: 4.0
error_type: symmetric
observables: [uv, dv, gluon]
x_min: 1.0e-4
x_max: 0.9
n_points: 100
ratio_reference: 0
ratio_ylim: [0.6, 1.6]
fits:
  - label: "Resummed baseline"
    path: inputs/gaussian
    source: xfitter-grid
  - label: "Resummed + EoE"
    path: inputs/eoe
    source: xfitter-grid

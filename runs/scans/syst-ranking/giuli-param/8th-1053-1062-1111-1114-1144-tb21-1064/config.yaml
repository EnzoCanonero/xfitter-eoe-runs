scan_type: systematic-ranking
xfitter_tree: xfitter-bartlett-fixes
template: giuli-param
epsilon: 0.6

# Eighth-order forward-selection scan with the Giuli parametrization (Q2cut = 3.5).
# The corrected 7th-round scan selects 1064 (dchi2_B = 1.69), so the base
# {1053,1062,1111,1114,1144,proc_tb21,1064} is held ON in every fit (eps 0.6),
# warm-started at the JOINT converged values from
# runs/scans/syst-ranking/giuli-param/7th-1053-1062-1111-1114-1144-tb21/runs/sysHZComb1064.
# Giuli has 23 PDF parameters, so the seven EoE sources are MINUIT #24--#30.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -15.8725}
  - {name: sysHZComb1062, type: E, init: -5.2484}
  - {name: sysHZComb1111, type: E, init: -2.6459}
  - {name: sysHZComb1114, type: E, init: 4.4917}
  - {name: sysHZComb1144, type: E, init: 4.4612}
  - {name: proc_tb21, type: E, init: -3.7783}
  - {name: sysHZComb1064, type: E, init: 7.1276}

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

xfitter_commit: 67398b15571dff1e9ddce0bc88923554552c9c84
request_memory: 2GB
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5
scan_type: systematic-ranking
xfitter_tree: merge-master/xfitter-master
template: giuli-param
epsilon: 0.6

# Fourth-order forward-selection scan with the Giuli parametrization (Q2cut = 3.5).
# sysHZComb1053 + sysHZComb1062 + sysHZComb1111 are held ON in every fit (eps 0.6),
# warm-started at their JOINT converged values from the 3rd-order {1053,1062,1111} fit
# (runs/scans/syst-ranking/giuli-param/3rd-1053-1062/runs/sysHZComb1111). Every candidate is ranked by its marginal
# impact on top of {1053, 1062, 1111}. The nominal fit is the {1053,1062,1111}-only fit.
# All three base sources are auto-excluded from the candidate list.
# Note: Giuli has 23 PDF parameter slots, so 1053=#24, 1062=#25, 1111=#26
# (computed automatically).
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.4645}
  - {name: sysHZComb1062, type: E, init: -6.1237}
  - {name: sysHZComb1111, type: E, init: -2.8002}

# HERA datafiles (all 7 files)
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (the three base sources removed automatically).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

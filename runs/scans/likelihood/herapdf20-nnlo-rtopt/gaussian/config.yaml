# Profile-likelihood scans for the 14 free HERA PDF parameters without EoE.
scan_type: likelihood-scan
# Build note: previously pinned to xFitter bd0470d9.
# Missing: a run on the merged xFitter master.
xfitter_tree: merge-master/xfitter-master
# xfitter_commit: aead2b830305623b73709f748a4db918a0bf136c
template: hera-baseline
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5

dataset_root: ../../../../../datasets/hera/h1zeusCombined/inclusiveDis/1506.06042
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

systematics: []

# Manual example ranges; adjust them for the study.
scan_params_1d:
  - {name: ADbar, min: 0.15, max: 0.45, npoints: 31}
  - {name: Agp, min: 0.01, max: 0.8, npoints: 31}
  - {name: BDbar, min: -0.2, max: -0.05, npoints: 31}
  - {name: Bdv, min: 0.5, max: 1.5, npoints: 31}
  - {name: Bg, min: -0.4, max: 0.2, npoints: 31}
  - {name: Bgp, min: -0.7, max: -0.1, npoints: 31}
  - {name: Buv, min: 0.6, max: 1.0, npoints: 31}
  - {name: CDbar, min: 3, max: 16, npoints: 31}
  - {name: CUbar, min: 2, max: 12, npoints: 31}
  - {name: Cdv, min: 2.5, max: 7, npoints: 31}
  - {name: Cg, min: 3, max: 9, npoints: 31}
  - {name: Cuv, min: 3, max: 6, npoints: 31}
  - {name: DUbar, min: -2, max: 6, npoints: 31}
  - {name: Euv, min: 3, max: 18, npoints: 31}

# Profile-likelihood scans for the HERA PDFs and seven greedy-selected sources.
scan_type: likelihood-scan
# Build note: previously pinned to xFitter bd0470d9.
# Missing: a run on the merged xFitter master.
xfitter_tree: merge-master/xfitter-master
# xfitter_commit: aead2b830305623b73709f748a4db918a0bf136c
template: hera-baseline
epsilon: 0.6
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5

dataset_root: ../../../../../datasets/hera/h1zeusCombined/inclusiveDis/1506.06042
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Source order also defines the MINUIT nuisance indices.
systematics:
  - {name: sysHZComb1053, type: E, init: -16.4095}
  - {name: proc_tb21,     type: E, init: -6.3118}
  - {name: sysHZComb1064, type: E, init: 9.9370}
  - {name: sysHZComb1114, type: E, init: 4.2443}
  - {name: sysHZComb1144, type: E, init: 4.0798}
  - {name: sysHZComb1111, type: E, init: -2.5331}
  - {name: sysHZComb1113, type: E, init: 3.8119}

# Manual example ranges; adjust them for the study.
scan_params_1d:
  - {name: Bg, min: -0.4, max: 0.2, npoints: 21}
  - {name: Cg, min: 3, max: 9, npoints: 21}
  - {name: Agp, min: 0.01, max: 0.8, npoints: 21}
  - {name: Bgp, min: -0.7, max: -0.1, npoints: 21}
  - {name: Buv, min: 0.6, max: 1.0, npoints: 21}
  - {name: Cuv, min: 3, max: 6, npoints: 21}
  - {name: Euv, min: 3, max: 18, npoints: 21}
  - {name: Bdv, min: 0.5, max: 1.5, npoints: 21}
  - {name: Cdv, min: 2.5, max: 7, npoints: 21}
  - {name: CUbar, min: 2, max: 12, npoints: 21}
  - {name: DUbar, min: -2, max: 6, npoints: 21}
  - {name: ADbar, min: 0.15, max: 0.45, npoints: 21}
  - {name: BDbar, min: -0.2, max: -0.05, npoints: 21}
  - {name: CDbar, min: 3, max: 16, npoints: 21}

scan_systematics_1d:
  - {name: sysHZComb1053, min: -22, max: -10, npoints: 21}
  - {name: proc_tb21, min: -10, max: -2, npoints: 21}
  - {name: sysHZComb1064, min: 4, max: 16, npoints: 21}
  - {name: sysHZComb1114, min: 0, max: 8, npoints: 21}
  - {name: sysHZComb1144, min: 0, max: 8, npoints: 21}
  - {name: sysHZComb1111, min: -6, max: 2, npoints: 21}
  - {name: sysHZComb1113, min: 0, max: 8, npoints: 21}

# xfitter_commit: aead2b830305623b73709f748a4db918a0bf136c
request_memory: 2GB
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5
scan_type: systematic-ranking
xfitter_tree: merge-master/xfitter-master
template: hera-baseline
epsilon: 0.6

# Third-order forward-selection scan (Q2cut = 3.5, baseline parametrization).
# sysHZComb1053 + proc_tb21 are held ON in every fit (eps 0.6), warm-started at their
# JOINT converged values from the 2nd-order {1053,proc_tb21} fit (baseline-2nd-1053).
# Every candidate is ranked by its marginal impact on top of {1053, proc_tb21}. The
# nominal fit is the {1053, proc_tb21}-only fit. Both base sources are auto-excluded
# from the candidate list below.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -16.5576}
  - {name: proc_tb21,     type: E, init: -4.5779}

# HERA datafiles (all 7 files)
dataset_root: ../../../../../../datasets/hera/h1zeusCombined/inclusiveDis/1506.06042
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (1053 and proc_tb21 removed automatically because
# they are base sources).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

# xfitter_commit: aead2b830305623b73709f748a4db918a0bf136c
request_memory: 2GB
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5
scan_type: systematic-ranking
xfitter_tree: merge-master/xfitter-master
template: hera-baseline
epsilon: 0.6

# HERA datafiles (all 7 files)
dataset_root: ../../../../../../datasets/hera/h1zeusCombined/inclusiveDis/1506.06042
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Test all 169 correlated sources at epsilon = 0.6.
# Retain each round winner only when its Bartlett-corrected improvement dchi2_B > 1.
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

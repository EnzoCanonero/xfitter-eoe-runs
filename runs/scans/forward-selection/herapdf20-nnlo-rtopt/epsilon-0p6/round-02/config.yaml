# xfitter_commit: aead2b830305623b73709f748a4db918a0bf136c
request_memory: 2GB
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5
scan_type: systematic-ranking
xfitter_tree: merge-master/xfitter-master
template: hera-baseline
epsilon: 0.6

# Second-order forward-selection scan (Q2cut = 3.5, baseline parametrization).
# sysHZComb1053 is held ON in every fit (eps 0.6), warm-started at its single-source
# minimum found in the baseline EoE scan (shift = -17.3848). Every candidate is then
# ranked by its *marginal* impact on top of an already-active 1053. The nominal fit is
# the 1053-only (lower-order) fit. 1053 is auto-excluded from the candidate list below.
base_systematics:
  - {name: sysHZComb1053, type: E, init: -17.3848}

# HERA datafiles (all 7 files)
dataset_root: ../../../../../../datasets/hera/h1zeusCombined/inclusiveDis/1506.06042
datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Candidate systematic sources to rank (sysHZComb1053 is removed automatically because
# it is a base source).
systematics:
  - {name: sysHZComb, range: "1001-1162", type: E}
  - {name: proc_nrl, type: E}
  - {name: proc_tb, range: "21-24", type: E}
  - {name: proc_gp, type: E}
  - {name: proc_had, type: E}

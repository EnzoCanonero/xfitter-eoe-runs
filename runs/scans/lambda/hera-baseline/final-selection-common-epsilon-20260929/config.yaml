# Common-epsilon study of the final seven-source HERA selection.
# The pipeline uses epsilon_s = epsilon * lambda. Setting epsilon=1 makes
# the numeric lambda coordinate equal to the physical common epsilon.
# All seven sources remain in the fit; epsilon=0 gives Gaussian constraints.
scan_type: lambda-scan
xfitter_tree: merge-master/xfitter-master
xfitter_commit: 67398b15571dff1e9ddce0bc88923554552c9c84
template: hera-baseline
epsilon: 1.0
lambda: {min: 0.0, max: 0.7, step: 0.1}
n_iterations: 2
enable_bartlett: true
q2_cut: 3.5
request_memory: 2GB

# Keep the uncertainty calculation used for the final selected fit, also
# retaining grids for the PDF and uncertainty comparisons.
doErrors:
  method: Pumplin
  errdef: 0.5
  iterate: 10

datafiles:
  - HERA1+2_NCep_920-thexp.dat
  - HERA1+2_NCep_820-thexp.dat
  - HERA1+2_NCep_575-thexp.dat
  - HERA1+2_NCep_460-thexp.dat
  - HERA1+2_NCem-thexp.dat
  - HERA1+2_CCep-thexp.dat
  - HERA1+2_CCem-thexp.dat

# Same NP seeds and declaration order as the final selected HERA fit.
# These are starting values, not fixed parameters; PDFs and NPs are refit.
systematics:
  - {name: sysHZComb1053, type: E, init: -16.4095, scale_with_lambda: true}
  - {name: proc_tb21,     type: E, init: -6.3118,  scale_with_lambda: true}
  - {name: sysHZComb1064, type: E, init: 9.9370,   scale_with_lambda: true}
  - {name: sysHZComb1114, type: E, init: 4.2443,   scale_with_lambda: true}
  - {name: sysHZComb1144, type: E, init: 4.0798,   scale_with_lambda: true}
  - {name: sysHZComb1111, type: E, init: -2.5331,  scale_with_lambda: true}
  - {name: sysHZComb1113, type: E, init: 3.8119,   scale_with_lambda: true}
